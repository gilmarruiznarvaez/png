name: Build Check

on:
  pull_request:
      branches: ["main", "master", "develop"]
          paths:
                - "colablancasite/**"
                  push:
                      branches: ["main", "master"]
                          paths:
                                - "colablancasite/**"

                                concurrency:
                                  group: build-${{ github.ref }}
                                    cancel-in-progress: true

                                    jobs:
                                      build:
                                          name: Next.js Build
                                              runs-on: ubuntu-latest
                                                  defaults:
                                                        run:
                                                                working-directory: colablancasite

                                                                    steps:
                                                                          - name: Checkout
                                                                                  uses: actions/checkout@v4

                                                                                        - name: Setup Node.js
                                                                                                uses: actions/setup-node@v4
                                                                                                        with:
                                                                                                                  node-version: "20"
                                                                                                                            cache: "npm"
                                                                                                                                      cache-dependency-path: colablancasite/package-lock.json
                                                                                                                                      
                                                                                                                                            - name: Install dependencies
                                                                                                                                                    run: npm ci
                                                                                                                                                    
                                                                                                                                                          - name: Lint
                                                                                                                                                                  run: npm run lint
                                                                                                                                                                  
                                                                                                                                                                        - name: Build
                                                                                                                                                                                run: npm run build
                                                                                                                                                                                        env:
                                                                                                                                                                                                  NEXT_TELEMETRY_DISABLED: 1
                                                                                                                                                                                                  
                                                                                                                                                                                                        - name: Upload build artifact (optional)
                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                        if: success()
                                                                                                                                                                                                                                with:
                                                                                                                                                                                                                                          name: nextjs-build-${{ github.sha }}
                                                                                                                                                                                                                                                    path: colablancasite/.next
                                                                                                                                                                                                                                                              retention-days: 3
